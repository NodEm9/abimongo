name: "Test: Dispatch Reusable Publish"

on:
  workflow_dispatch:
    inputs:
      package_path:
        description: 'Relative package path to publish'
        required: false
        type: string
        default: 'packages/core'
      package_name:
        description: 'Package name for logging'
        required: false
        type: string
        default: '@abimongo/core'
      package_manager:
        description: 'Package manager to use: pnpm or npm'
        required: false
        type: string
        default: 'pnpm'
      dry_run:
        description: 'If true, do not actually publish'
        required: false
        type: boolean
        default: true

jobs:
  validate:
    name: Validate build and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm (Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ordered build
        run: pnpm run build:ordered

      - name: Workspace typecheck
        run: pnpm -w -r exec tsc --build

  call-reusable:
    name: Dispatch reusable publish
    needs: validate
    uses: ./.github/workflows/reusable-publish.yml
    with:
      package_path: ${{ github.event.inputs.package_path }}
      package_name: ${{ github.event.inputs.package_name }}
      package_manager: ${{ github.event.inputs.package_manager }}
      dry_run: ${{ github.event.inputs.dry_run }}
