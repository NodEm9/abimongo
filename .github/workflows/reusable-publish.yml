name: Reusable Publish

on:
  workflow_call:
    inputs:
      package_path:
        description: 'Relative path to the package (e.g. packages/core)'
        required: true
        type: string
      package_name:
        description: 'Package name (for logging), e.g. @abimongo/core'
        required: true
        type: string
      registry:
        description: 'Optional registry URL (defaults to npmjs)'
        required: false
        type: string
      dry_run:
        description: 'If true, do not actually publish'
        required: false
        type: boolean
        default: false
      package_manager:
        description: 'Package manager to use: npm or pnpm'
        required: false
        type: string
        default: 'npm'
    secrets:
      NODE_AUTH_TOKEN:
        description: 'NPM authentication token'
        required: true
  workflow_dispatch:
    inputs:
      package_path:
        description: 'Relative path to the package (e.g. packages/core)'
        required: true
        type: string
      package_name:
        description: 'Package name (for logging), e.g. @abimongo/core'
        required: true
        type: string
      registry:
        description: 'Optional registry URL (defaults to npmjs)'
        required: false
        type: string
      dry_run:
        description: 'If true, do not actually publish'
        required: false
        type: boolean
        default: false
      package_manager:
        description: 'Package manager to use: npm or pnpm'
        required: false
        type: string
        default: 'npm'

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ inputs.package_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: ${{ inputs.registry || 'https://registry.npmjs.org' }}

      - name: Install dependencies (repo)
        run: |
          if [ "${{ inputs.package_manager }}" = "pnpm" ]; then
            corepack enable
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Build all workspace packages (fast-path)
        if: ${{ inputs.package_manager == 'pnpm' }}
        run: |
          # Build all workspace packages so their dist outputs exist for dependent package builds
          pnpm -w -r run build

      - name: Build package
        run: |
          if [ ! -f "${{ inputs.package_path }}/package.json" ]; then
            echo "Package not found at ${{ inputs.package_path }}" && exit 1
          fi
          if [ "${{ inputs.package_manager }}" = "pnpm" ]; then
            pnpm --dir ${{ inputs.package_path }} run build --if-present
          else
            npm --prefix ${{ inputs.package_path }} run build --if-present
          fi

      - name: Run package tests
        run: |
          if [ "${{ inputs.package_manager }}" = "pnpm" ]; then
            pnpm --dir ${{ inputs.package_path }} test --if-present
          else
            npm --prefix ${{ inputs.package_path }} test --if-present
          fi

      - name: Publish package (or dry-run)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run for ${{ inputs.package_name }} at ${{ inputs.package_path }}"
            exit 0
          fi
          echo "Publishing ${{ inputs.package_name }} from ${{ inputs.package_path }}"
          if [ "${{ inputs.package_manager }}" = "pnpm" ]; then
            pnpm --dir ${{ inputs.package_path }} publish --access public
          else
            npm --prefix ${{ inputs.package_path }} publish --access public
          fi
