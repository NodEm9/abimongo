name: CI • Publish • Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pages: write

jobs:
  build-test:
    name: Build & Test (All Packages)
    runs-on: ubuntu-latest

    strategy:
     matrix:
       node-version: [20.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node  ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'
      
      
      - run: corepack enable         # makes pnpm/yarn via Corepack available
      - run: corepack install        # installs the exact pnpm from packageManager

      # sanity check
      - run: pnpm -v

      - run: pnpm install            # uses cache if pnpm-lock.yaml is at repo root
      - run: pnpm -r build           # monorepo example
      - run: pnpm -r test

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.19.0

      - name: Install (workspaces)
        run: pnpm install --frozen-lockfile --prefer-workspace-packages

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name:  Build
        run: pnpm run build

      - name: Save dist artifacts (optional)
        uses: actions/upload-artifact@v4
        with:
          name: abimongo-dist
          path: |
            packages/**/dist
          retention-days: 7

  release:
    name: Publish to npm (Changesets)
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'

      
      - run: corepack enable         # makes pnpm/yarn via Corepack available
      - run: corepack install        # installs the exact pnpm from packageManager

      # sanity check
      - run: pnpm -v

      - run: pnpm install            # uses cache if pnpm-lock.yaml is at repo root
      - run: pnpm -r build           # monorepo example
      - run: pnpm -r test

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.19.0

      - name: Install
        run: pnpm install --prefer-workspace-packages

      - name: Build (ensure dist exists before publish)
        run: pnpm run build

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # When there are unpublished changesets on main:
          #  - creates a version bump PR (if not present), OR
          #  - publishes to npm if the PR is already merged
          publish: npm run release
          commit: "chore(release): publish new versions"
          title: "chore(release): publish new versions"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  docs:
    name: Build & Deploy Docs
    needs: [build-test] # you can switch to [release] if you want docs only after a publish
    runs-on: ubuntu-latest
    strategy:
     matrix:
      node-version: [20.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.19.0

      - name: Install
        run: pnpm install --prefer-workspace-packages

      - name: Build docs (TypeDoc)
        run: pnpm run api:docs && npm run docs:build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/website/build


      # - name: Deploy to GitHub Pages (alternative)
      #   uses: actions/deploy-pages@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/website/build
          publish_branch: gh-pages
