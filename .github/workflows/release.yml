name: CI • Publish • Docs

on:
  push:
    branches: [ main ]
    paths-ignore:
       - 'tests/**'
       - 'examples/**'
       - 'log/abimongo.log'
       - 'records.json'
  workflow_dispatch:


# Permissions required by:
# - changesets/action (creates PR/commits)
# - actions/deploy-pages
permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: read 

concurrency:
  # Avoid concurrent deploys to GitHub Pages
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (All Packages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

       # Node only (no pnpm cache here)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      # Install pnpm binary explicitly (don’t use Corepack here)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      # Sanity checks
      - run: node -v && pnpm -v && npm -v

      # Install workspace deps (single root lockfile)
      # If you DON'T have a lock yet, use --no-frozen-lockfile
      - name: Install
        run: pnpm install --no-frozen-lockfile --link-workspace-packages 

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      # - name: Build
      #   run: pnpm run build

      - name: Build workspaces (ensures logger before core)
        run: pnpm run build:ordered

      - name: Save dist artifacts (optional)
        uses: actions/upload-artifact@v4
        with:
          name: abimongo-dist
          path: packages/**/dist
          retention-days: 7
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  release:
    name: Publish to npm (Changesets)
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

       # Node only (no pnpm cache here)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      # Install pnpm binary explicitly (don’t use Corepack here)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      # Sanity checks
      - run: node -v && pnpm -v && npm -v

      # Install workspace deps (single root lockfile)
      # If you DON'T have a lock yet, use --no-frozen-lockfile
      - name: Install
        run: pnpm install --no-frozen-lockfile --link-workspace-packages

      - name: Build (ensure dist exists before publish)
        run: pnpm run build

      - name: Create Release PR or Publish (Changesets)
        uses: changesets/action@v1
        with:
          # If there are unpublished changesets on main:
          # - it will open/refresh a version bump PR
          # If that PR is merged:
          # - it will run this publish command
          publish: npm run release
          commit: "chore(release): publish new versions"
          title: "chore(release): publish new versions"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          2FACTOR_AUTH_TOKEN: ${{ secrets.NPM_2FACTOR_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }} # <-- add this secret in repo settings

  docs:
    name: Build & Deploy Docs (GitHub Pages)
    needs: build-test              # or: [release] if you only want docs after publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

       # Node only (no pnpm cache here)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      # Install pnpm binary explicitly (don’t use Corepack here)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      # Sanity checks
      - run: node -v && pnpm -v && npm -v

      # Install workspace deps (single root lockfile)
      # If you DON'T have a lock yet, use --no-frozen-lockfile
      - name: Install
        run: pnpm install --no-frozen-lockfile --link-workspace-packages

      - name: Build workspaces (ensures logger before core)
        run: pnpm run build:ordered

      - name: Build docs (TypeDoc + Docusaurus)
        run: pnpm run api:docs 
        # Make sure docs output to: docs/website/build

      - name: Build Docusaurus
        run: pnpm run docs:build

      # Official GitHub Pages deploy (Actions mode)
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/website/build

      - id: deploy
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  