name: CI • Publish • Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pages: write

jobs:
  build-test:
    name: Build & Test (All Packages)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      - name: 📦 Install (workspaces)
        run: npm ci

      - name: 🧼 Lint
        run: npm run lint

      - name: 🧪 Test
        run: npm run test

      - name: 🏗️ Build
        run: npm run build

      - name: ⬆️ Save dist artifacts (optional)
        uses: actions/upload-artifact@v4
        with:
          name: abimongo-dist
          path: |
            packages/**/dist
          retention-days: 7

  release:
    name: Publish to npm (Changesets)
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      - name: 📦 Install
        run: npm ci

      - name: 🏗️ Build (ensure dist exists before publish)
        run: npm run build

      - name: 🚀 Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # When there are unpublished changesets on main:
          #  - creates a version bump PR (if not present), OR
          #  - publishes to npm if the PR is already merged
          publish: npm run release
          commit: "chore(release): publish new versions"
          title: "chore(release): publish new versions"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  docs:
    name: Build & Deploy Docs
    needs: [build-test] # you can switch to [release] if you want docs only after a publish
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install
        run: npm ci

      - name: 📚 Build docs (TypeDoc)
        run: npm run api:docs && npm run docs:build

      - name: 🌐 Configure Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/website/build

      - name: 🚀 Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
				