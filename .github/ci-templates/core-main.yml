## Archived package workflow template: packages/core/.github/workflows/main.yml
## Moved to .github/ci-templates/ as a template; not executed by Actions here.

name: CI - Abimongo Core Library

on:
  push:
    branches: 
      - main
      - 'releases/**'
    paths-ignore:
        - 'tests/**'
        - 'examples/**'
        - 'LICENSE'
        - 'package-lock.json'
        - 'log/abimongo.log'
        - 'records.json'
  pull_request:
    branches: 
      - main, 
      - 'releases/**'
      
permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20.x]
        cache: 'pnpm'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install

      - name: Lint Code
        run: pnpm run lint
       
      - name: Run Tests
        env:
          MONGO_URI: mongodb://localhost:27017
        run: pnpm test --detectOpenHandles

      - name: Build with Webpack
        run: |
          pnpm install
          pnpm run build

      - name: Verify Build Output
        run: |
          if [ ! -f ./src/bin/abimongo-core.node.js ] && [ ! -f ./src/bin/abimongo-core-vli.js ]; then
            echo "Build failed: abimongo-core.node.js or abimongo-core.js not found!"
            exit 1
          fi
          echo "Build succeeded: abimongo-core.node.js and abimongo-core-cli.js exists."
      
      # - name: Upload Coverage Report
      #   uses: codecov/codecov-action@v4
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     fail_ci_if_error: true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: abimongo/core-build-${{ github.run_number }}-${{ github.sha }}
          path: |
            ./dist
            ./package.json
            ./README.md
            ./LICENSE
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup Old Runs
        run: |
          gh run list --limit 10 | awk '/abimongo/core/ {print $1}' | xargs -I {} gh run delete {} --confirm
        env:
          GI_TOKEN: ${{ secrets.GH_TOKEN }}
    
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          ssh -T git@github.com || echo "SSH connection test failed. Check your SSH key."

      - name: Configure Git for SSH
        run: |
          git remote set-url origin git@github.com:${{ github.repository }}.git
    
      - name: Configure Git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com" 
          git config --global user.name "$(gh api /users/${GITHUB_ACTOR} | jq .name -r)"
          git config -l

      - name: Add and Commit Changes
        run: |
          git add .
          git commit -m "chore: Automated release [skip ci]" || echo "No changes to commit"
          git push origin main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Prepare for npm Versioning
        run: |
          git add .
          git commit -m "chore: Prepare for version bump [skip ci]" || echo "No changes to commit"
          git push origin main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ensure Clean Working Directory
        run: |
          git add .
          git commit -m "chore: Commit untracked changes [skip ci]" || echo "No changes to commit"
          git push origin main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Fetch all tags for versioning
        run: git fetch --tags --force

      - name: Generate changelog
        run: npx auto-changelog 

      - name: Add and Commit Changes
        run: |
          git add CHANGELOG.md
          git commit -m "chore: Update changelog [skip ci]" || echo "No changes to commit"

      - name: Bump Version (Only on Main)
        if: github.ref == 'refs/heads/main'
        run: |
          git status  # Debug step to verify clean working directory
          npm version patch -m "CI: Bump version to %s [skip ci]"
          git add . 
          git commit -m "chore: Commit untracked Version bump [skip ci]" || echo "No changes to commit"
          git push origin main 
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      
      # - name: Clear Pnpm Cache 
      #   run: |
      #     pnpm store prune
      - name: Publish to npm (Only on Main)
        if: github.ref == 'refs/heads/main'
        run: |
          pnpm -r publish --tag latest --no-git-checks
        env:
          2FACTOR_TOKEN: ${{ secrets.NPM_2FACTOR_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
