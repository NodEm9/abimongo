name: "Test: Dispatch Reusable Publish"

on:
  workflow_dispatch:
    inputs:
      package_path:
        description: 'Relative package path to publish'
        required: false
        type: string
        default: 'packages/core'
      package_name:
        description: 'Package name for logging'
        required: false
        type: string
        default: '@abimongo/core'
      package_manager:
        description: 'Package manager to use: pnpm or npm'
        required: false
        type: string
        default: 'pnpm'
      dry_run:
        description: 'If true, do not actually publish'
        required: false
        type: boolean
        default: true

jobs:
  validate:
    name: Validate build and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm (Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ordered build
        run: pnpm run build:ordered

      - name: Workspace typecheck
        run: pnpm -w -r exec tsc --build

  call-reusable:
    name: Publish package inline
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      - name: Enable pnpm (Corepack)
        if: ${{ github.event.inputs.package_manager == 'pnpm' }}
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Clear caches (npm/pnpm)
        run: |
          echo "Clearing npm cache"
          npm cache clean --force || true
          npm cache verify || true
          if [ "${{ github.event.inputs.package_manager }}" = "pnpm" ]; then
            echo "Pruning pnpm store"
            pnpm store prune || true
          fi

      - name: Install dependencies
        run: |
          if [ "${{ github.event.inputs.package_manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Build package
        run: |
          if [ "${{ github.event.inputs.package_manager }}" = "pnpm" ]; then
            pnpm --dir ${{ github.event.inputs.package_path }} run build
          else
            npm --prefix ${{ github.event.inputs.package_path }} run build
          fi

      - name: Publish to npm
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry run: would publish ${{ github.event.inputs.package_name }} from ${{ github.event.inputs.package_path }}"
            exit 0
          fi
          echo "Publishing ${{ github.event.inputs.package_name }} from ${{ github.event.inputs.package_path }}"
          cd ${{ github.event.inputs.package_path }}
          echo "Ensuring registry and auth"
          npm config set registry https://registry.npmjs.org
          npm whoami || true
          echo "Clearing npm cache before publish"
          npm cache clean --force || true
          if [ "${{ github.event.inputs.package_manager }}" = "pnpm" ]; then
            pnpm publish --access public ${2FACTOR_TOKEN: $NPM_2FACTOR_TOKEN }
          else
            npm publish --access public ${2FACTOR_TOKEN: $NPM_2FACTOR_TOKEN } 
          fi
        env:
          NPM_PASS_KEY: ${{ secrets.NPM_PASS_KEY }}
          2FACTOR_TOKEN: ${{ secrets.NPM_2FACTOR_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}