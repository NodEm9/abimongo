## Archived package workflow template: packages/logger/.github/workflows/main.yml
## Moved to .github/ci-templates/ as a template; not executed by Actions here.

name: Publish Scoped Package

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - '.github/workflows/publish.yml'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js & PNPM
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org/'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build
      

      - name: Bump Version (Only on Main)
        if: github.ref == 'refs/heads/main'
        run: |
            git status  # Debug step to verify clean working directory
            npm version patch -m "CI: Bump version to %s [skip ci]"
            git add . 
            git commit -m "chore: Commit untracked Version bump [skip ci]" || echo "No changes to commit"
            git push origin main 
            env:
            SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
            GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Publish packages
        run: |
          for pkg in ./packages/*; do
            if [ -f "$pkg/package.json" ]; then
              cd $pkg
              name=$(jq -r .name package.json)
              version=$(jq -r .version package.json)
              echo " Publishing $name@$version"
               pnpm -r publish --tag latest --no-git-checks --access public || echo "⚠️ Skipping: $name (possibly already published)"
              cd -
            fi
          done
        env:
          2FACTOR_TOKEN: ${{ secrets.NPM_2FACTOR_TOKEN }} 
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
