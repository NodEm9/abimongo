name: Metrics snapshot

on:
  schedule:
    - cron: '0 2 * * *' # run daily at 02:00 UTC (adjust as needed)
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run snapshot generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node docs/website/dev/generate_metrics_snapshot.js
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/website/static/api/metrics.json
          git commit -m "chore(metrics): update snapshot [ci skip]" || echo "No changes"
          git push origin HEAD:main
