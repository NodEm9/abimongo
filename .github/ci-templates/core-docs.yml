## Archived package workflow template: packages/core/.github/workflows/docs.yml
## Moved to .github/ci-templates/ as a template; not executed by Actions here.

name: Deploy Docs

on:
  push:
    branches: [main]

permissions:
   contents: read
   pages: write
   id-token: write

jobs:
  docs:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version:  ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm install

      - name: 🛠️ Generate Docs 
        run: npx typedoc --entryPoints src/index.ts --tsconfig tsconfig.json

      - name: 🛠️ Build Docusaurus
        run: |
          cd docs-site
          npm install
          npm run build

      - name: 📤 Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: docusaurus-site
          path: ./docs-site/build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-site/build
          publish_branch: gh-pages
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN}}
          # SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # NODE_ENV: production
      - name: Show Deployed Site URL
        run: echo 'Your documentation should be available at:' 'https://NodEm9.github.io/abimongo/'
