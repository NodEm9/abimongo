name: Metrics snapshot

on:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run snapshot generator
        run: node docs/website/dev/generate_metrics_snapshot.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/website/static/api/metrics.json docs/website/static/api/npm-downloads.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(metrics): update snapshot [skip ci]" || true
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
