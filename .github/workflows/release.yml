name: CI • Publish • Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pages: write

jobs:
  build-test:
    name: Build & Test (All Packages)
    runs-on: ubuntu-latest

    strategy:
     matrix:
       node-version: [20.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup 
        uses: actions/setup-node@v4
      - uses: actions/setup-node@v4
        with:
         node-version: 20
         cache: 'pnpm'

      - run: corepack enable
      - run: corepack install

      - name: Install (workspaces)
        run: pnpm install --frozen-lockfile --prefer-workspace-packages

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name:  Build
        run: pnpm run build

      - name: Save dist artifacts (optional)
        uses: actions/upload-artifact@v4
        with:
          name: abimongo-dist
          path: |
            packages/**/dist
          retention-days: 7

  release:
    name: Publish to npm (Changesets)
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'

      
      - run: corepack enable       
      - run: corepack install        

      - name: Install
        run: pnpm install --frozen-lockfile --prefer-workspace-packages

      - name: Build (ensure dist exists before publish)
        run: pnpm run build

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # When there are unpublished changesets on main:
          #  - creates a version bump PR (if not present), OR
          #  - publishes to npm if the PR is already merged
          publish: npm run release
          commit: "chore(release): publish new versions"
          title: "chore(release): publish new versions"
        env:
          2FACTOR_TOKEN: ${{ secrets.NPM_2FACTOR_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  docs:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # build your site into docs/website/build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile --prefer-workspace-packages
      - run: pnpm run api:docs && pnpm run docs:build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/website/build
      - id: deploy
        uses: actions/deploy-pages@v4